name: Apply reviewed DrWael correction once
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Apply reviewed patch only after exact head and source guard
      env:
        EXPECTED_HEAD: ${{ github.sha }}
      shell: python
      run: 'import pathlib,base64,zlib,subprocess,os

        expected=os.environ[''EXPECTED_HEAD'']

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==expected

        assert subprocess.check_output([''git'',''ls-remote'',''origin'',''refs/heads/main''],text=True).split()[0]==expected,''Concurrent main edit''

        assert subprocess.check_output([''git'',''diff'',''--name-only'',''611935fc36cd8684d53d7aa26347afb390f64cb2'',''HEAD''],text=True).splitlines()==[''.github/workflows/build.yml''],''Unexpected baseline delta''

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD:main.js''],text=True).strip()==''ddb9336d73da7bdd4ea0c4d6f55764cdf89a2278'',''Source already corrected or different''

        pathlib.Path(''/tmp/correction.patch'').write_bytes(zlib.decompress(base64.b64decode('''')))

        subprocess.run([''git'',''apply'',''--check'',''/tmp/correction.patch''],check=True)

        subprocess.run([''git'',''apply'',''/tmp/correction.patch''],check=True)

        pathlib.Path(''tests/original-default.test.js'').write_bytes(base64.b64decode(''''))

        subprocess.run([''npm'',''install'',''--no-audit'',''--no-fund''],check=True)

        subprocess.run([''npm'',''run'',''lint''],check=True)

        subprocess.run([''bash'',''-c'',''node --test tests/*.test.js''],check=True)

        subprocess.run([''npm'',''run'',''build''],check=True)

        subprocess.run([''npm'',''run'',''desktop:zip''],check=True)

        subprocess.run([''git'',''config'',''user.name'',''github-actions[bot]''],check=True)

        subprocess.run([''git'',''config'',''user.email'',''41898282+github-actions[bot]@users.noreply.github.com''],check=True)

        subprocess.run([''git'',''add'',''--all''],check=True)

        subprocess.run([''git'',''commit'',''-m'',''Remove Windows Hello and restore original default interface [skip ci]''],check=True)

        assert subprocess.check_output([''git'',''ls-remote'',''origin'',''refs/heads/main''],text=True).split()[0]==expected,''Concurrent edit, refusing push''

        subprocess.run([''git'',''push'',''origin'',''HEAD:main''],check=True)

        '
