name: Build Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish only after source validation
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Find the project folder
        run: |
          if [ -f package.json ]; then
            S=./package.json
          else
            S=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' -not -path './_project/*' | head -1)
          fi
          if [ -z "$S" ]; then
            Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then
              echo "Project files not found, extracting $Z"
              mkdir -p _project
              python -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$Z" _project
              S=$(find _project -maxdepth 3 -name package.json | head -1)
            fi
          fi
          if [ -z "$S" ]; then
            echo "::error::No project found. Upload DrWael-Desktop-Project.zip to the repository root (or the extracted files)."
            ls -la
            exit 1
          fi
          D=$(dirname "$S")
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project folder: $D"
          test -f "$D/app/index.html" || { echo "::error::app/index.html is missing"; exit 1; }

      - name: Optional private config from secrets
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "$APP_CONFIG_JSON" ]; then
            echo "$APP_CONFIG_JSON" > "$PROJECT_DIR/config.json"
            echo "Using config.json from repository secrets"
          fi

      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dependencies = p.dependencies || {};
            p.devDependencies = p.devDependencies || {};
            p.devDependencies.express = p.dependencies.express || "^5.3.0";
            delete p.dependencies.express;
            delete p.dependencies["electron-updater"];
            if (!p.devDependencies.electron) p.devDependencies.electron = "^33.2.1";
            if (!p.devDependencies["electron-builder"]) p.devDependencies["electron-builder"] = "^25.1.8";
            if (!p.homepage) p.homepage = "https://github.com/khaledahmed34567/DrWael-Desktop";
            if (typeof p.author === "string" && !p.author.includes("@")) p.author = p.author + " <info@drwael.app>";
            if (p.build && p.build.linux && !p.build.linux.maintainer) p.build.linux.maintainer = "Dr. Wael <info@drwael.app>";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          npm install --no-audit --no-fund

      - name: Validate app source and behavior
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run lint && node --test tests/*.test.js && npm run build

      - name: Build installers
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Collect files
        run: |
          mkdir -p out
          cd "$PROJECT_DIR/dist"
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.blockmap latest*.yml; do
            [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/out/" || true
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload build files
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5

      - name: Download all build files
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: release_files

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: 1.1.${{ github.run_number }}
        run: |
          ls -la release_files
          git log -1 --pretty=%B > notes.txt || echo "Dr. Wael $V" > notes.txt
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" release_files/* --clobber
          else
            gh release create "v$V" release_files/* --title "Dr. Wael $V" --notes-file notes.txt --latest
          fi
