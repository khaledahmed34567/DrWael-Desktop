<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:AJ;font-weight:400;src:url(assets/fonts/aj_400.ttf)}
@font-face{font-family:AJ;font-weight:700;src:url(assets/fonts/aj_700.ttf)}
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:AJ,system-ui,sans-serif;padding:14px}
.card{background:#fff;border-radius:26px;padding:20px 22px 16px;box-shadow:0 16px 50px rgba(0,0,0,.35)}
.bar{width:42px;height:5px;border-radius:3px;background:#B22127;margin-bottom:14px}
h1{margin:0;font-size:19px;color:#101426}
p{margin:10px 0 0;font-size:14.5px;line-height:1.7;color:#4a4f68;white-space:pre-wrap;max-height:300px;overflow:auto;word-break:break-word}
input{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:11px 12px;border:0;border-radius:14px;background:#f1f1f4;font:inherit;font-size:15px;color:#101426;outline:2px solid transparent}
input:focus{outline-color:#B22127}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:10px 22px;min-width:96px;cursor:pointer}
#ok{background:#B22127;color:#fff}#no{background:#f1f1f4;color:#4a4f68}
@media print{html,body{display:none!important;visibility:hidden!important}}
</style>
</head>
<body>
<div class="card" id="c"><div class="bar"></div><h1 id="t"></h1><p id="m"></p><input id="i" hidden><div class="row"><button id="no"></button><button id="ok"></button></div></div>
<script>
const $ = (id) => document.getElementById(id);
let kind = 'alert';
const finish = (ok) => {
  if (kind === 'prompt') window.__dlg.done(ok ? $('i').value : null);
  else if (kind === 'confirm') window.__dlg.done(!!ok);
  else window.__dlg.done(true);
};
window.__dlg.onInit((o) => {
  kind = o.k;
  const ar = (o.l || 'ar') !== 'en';
  document.documentElement.dir = o.rtl === false ? 'ltr' : (ar ? 'rtl' : 'ltr');
  $('t').textContent = o.title || (ar ? 'د. وائل' : 'Dr. Wael');
  $('m').textContent = o.m || '';
  $('m').hidden = !o.m;
  $('ok').textContent = o.okText || (ar ? 'حسنًا' : 'OK');
  $('no').textContent = o.cancelText || (ar ? 'إلغاء' : 'Cancel');
  $('no').hidden = kind === 'alert';
  if (kind === 'prompt') { $('i').hidden = false; $('i').value = o.d || ''; setTimeout(() => { $('i').focus(); $('i').select(); }, 50); }
  else setTimeout(() => $('ok').focus(), 50);
  setTimeout(() => window.__dlg.size(document.getElementById('c').offsetHeight + 28), 30);
});
$('ok').onclick = () => finish(true);
$('no').onclick = () => finish(false);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') finish(true);
  if (e.key === 'Escape') finish(kind === 'alert');
});
</script>
</body>
</html>
