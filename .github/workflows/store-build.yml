name: Build Store Package
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Validate source and Store gate
      shell: bash
      run: npm install --no-audit --no-fund && node --check main.js && node --check store-startup.js && node --check
        store-update.js && node --test tests/*.test.js && npm run build
    - name: Prepare Microsoft Store package
      shell: bash
      run: node scripts/prepare-store.js
    - name: Generate branded Store tiles
      shell: pwsh
      run: "Add-Type -AssemblyName System.Drawing\nNew-Item -ItemType Directory -Force build/appx | Out-Null\n$src\
        \ = [System.Drawing.Image]::FromFile((Resolve-Path build/icon.png))\nforeach ($item in @(@('StoreLogo.png',50,50),@('Square44x44Logo.png',44,44),@('Square150x150Logo.png',150,150),@('Wide310x150Logo.png',310,150),@('Square310x310Logo.png',310,310)))\
        \ {\n  $w=[int]$item[1]; $h=[int]$item[2]\n  $bmp=New-Object System.Drawing.Bitmap($w,$h)\n  $g=[System.Drawing.Graphics]::FromImage($bmp)\n\
        \  $g.Clear([System.Drawing.Color]::White)\n  $g.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic\n\
        \  $side=[int]([Math]::Min($w,$h)*1.0)\n  $g.DrawImage($src,[int](($w-$side)/2),[int](($h-$side)/2),$side,$side)\n\
        \  $bmp.Save((Join-Path $pwd ('build/appx/'+$item[0])),[System.Drawing.Imaging.ImageFormat]::Png)\n  $g.Dispose();\
        \ $bmp.Dispose()\n}\n$src.Dispose()"
    - name: Install dependencies
      run: npm install --no-audit --no-fund
      shell: bash
    - name: Build and smoke-test native Store helper
      shell: pwsh
      run: ./scripts/build-store-helper.ps1
    - name: Real Electron sandbox and native-helper rejection smoke
      shell: bash
      run: npx electron tests/electron-store-gate-smoke.cjs
    - name: Build unsigned package for Store signing only
      shell: bash
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: npx electron-builder --win appx --x64 --publish never
    - name: Upload Store package
      uses: actions/upload-artifact@v5
      with:
        name: store-package
        path: dist/*.appx
        if-no-files-found: error
