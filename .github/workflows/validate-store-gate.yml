name: Validate Store startup gate
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Load candidate source without publishing it
      shell: python
      run: "import base64,json,pathlib,zlib,subprocess\nfiles=json.loads(zlib.decompress(base64.b64decode('')))\n\
        pathlib.Path('candidate-source.json').write_text(json.dumps(files))\nfor name,body in files.items():\n p=pathlib.Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(body.encode())\nsubprocess.run(['git','apply','--unidiff-zero','candidate-app.patch'],check=True)\n"
    - name: Install test dependencies
      shell: bash
      run: npm install --no-audit --no-fund
    - name: Source and gate tests
      shell: bash
      run: node --check main.js && node --check store-startup.js && node --check store-update.js && node --test tests/*.test.js
    - name: Prepare unsigned Store candidate with current Windows runtime
      shell: bash
      env:
        STORE_BUILD_NUMBER: '3'
      run: node scripts/prepare-store.js && npm install --no-audit --no-fund
    - name: Generate branded Store tiles
      shell: pwsh
      run: "Add-Type -AssemblyName System.Drawing\nNew-Item -ItemType Directory -Force build/appx | Out-Null\n$src = [System.Drawing.Image]::FromFile((Resolve-Path build/icon.png))\nforeach ($item in @(@('StoreLogo.png',50,50),@('Square44x44Logo.png',44,44),@('Square150x150Logo.png',150,150),@('Wide310x150Logo.png',310,150),@('Square310x310Logo.png',310,310))) {\n  $w=[int]$item[1]; $h=[int]$item[2]\n  $bmp=New-Object System.Drawing.Bitmap($w,$h)\n  $g=[System.Drawing.Graphics]::FromImage($bmp)\n  $g.Clear([System.Drawing.Color]::White)\n  $g.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic\n  $side=[int]([Math]::Min($w,$h)*1.0)\n  $g.DrawImage($src,[int](($w-$side)/2),[int](($h-$side)/2),$side,$side)\n  $bmp.Save((Join-Path $pwd ('build/appx/'+$item[0])),[System.Drawing.Imaging.ImageFormat]::Png)\n  $g.Dispose(); $bmp.Dispose()\n}\n$src.Dispose()"
    - name: Compile and execute native Windows helper
      shell: pwsh
      run: ./scripts/build-store-helper.ps1
    - name: Real Electron renderer and helper rejection smoke, not a Store-install test
      shell: bash
      run: npx electron tests/electron-store-gate-smoke.cjs
    - name: Build unsigned candidate only, never publish
      shell: bash
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: npx electron-builder --win appx --x64 --publish never
    - name: Save candidate evidence, not an app release
      uses: actions/upload-artifact@v5
      with:
        name: store-gate-candidate-validation
        path: 'dist/*.appx

          build/native/store-update-check.exe

          build/validation/*.png'
        if-no-files-found: error
    - name: Publish validated source only, not an installer release
      shell: python
      run: 'import json,pathlib,subprocess

        files=json.loads(pathlib.Path(''candidate-source.json'').read_text())

        pathlib.Path(''package.json'').write_bytes(files[''package.json''].encode())

        names=[n for n in files if n!=''candidate-app.patch'' and not n.startswith(''.github/'')]+[''app/index.html'']

        subprocess.run([''git'',''config'',''user.name'',''github-actions[bot]''],check=True)

        subprocess.run([''git'',''config'',''user.email'',''41898282+github-actions[bot]@users.noreply.github.com''],check=True)

        subprocess.run([''git'',''add'',''--'']+names,check=True)

        subprocess.run([''git'',''commit'',''-m'',''Add Store startup gate, focus timer and exam calendar export [skip ci]''],check=True)

        subprocess.run([''git'',''push'',''origin'',''HEAD:main''],check=True)

        '
