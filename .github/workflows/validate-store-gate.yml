name: Validate Store startup gate
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Load candidate source without publishing it
      shell: python
      run: "import base64,json,pathlib\nfiles=json.loads(base64.b64decode(''))\n\
        for name,body in files.items():\n p=pathlib.Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(body))\n"
    - name: Install test dependencies
      shell: bash
      run: npm install --no-audit --no-fund
    - name: Source and gate tests
      shell: bash
      run: node --check main.js && node --check store-startup.js && node --check store-update.js && node --test tests/*.test.js
    - name: Compile and execute native Windows helper
      shell: pwsh
      run: ./scripts/build-store-helper.ps1
    - name: Save native helper for inspection, not an app release
      uses: actions/upload-artifact@v5
      with:
        name: store-helper-validation
        path: build/native/store-update-check.exe
        if-no-files-found: error
